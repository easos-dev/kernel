services:
  kernel:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      EASOS_HOME: /easos
      EASOS_RUNTIME_HOME: /run/easos
      RUST_LOG: info
    volumes:
      - ..:/easos
    tmpfs:
      - /run/easos:mode=0755
    healthcheck:
      test: ["CMD", "/usr/local/bin/easos", "list"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  dev:
    image: debian:trixie-slim
    profiles: ["tools"]
    working_dir: /easos/kernel
    environment:
      CARGO_HOME: /cargo
      CARGO_TARGET_DIR: /target
      DEBIAN_FRONTEND: noninteractive
    entrypoint:
      - /bin/sh
      - -c
      - >-
        apt-get update >/dev/null &&
        apt-get install -y --no-install-recommends ca-certificates cargo rustc rustfmt rust-clippy >/dev/null &&
        exec "$@"
      - tools
    volumes:
      - ..:/easos
      - cargo-registry:/cargo/registry
      - cargo-target:/target

volumes:
  cargo-registry:
  cargo-target:
